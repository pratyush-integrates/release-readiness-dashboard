{% extends "base.html" %}
{% block content %}
<h1>Pick a release</h1>
<form method="get" action="{{ url_for('dashboard.index') }}" class="card picker">
  <label>Jira project
    <select name="project" onchange="this.form.submit()">
      <option value="">Choose a project</option>
      {% for p in projects %}
        <option value="{{ p.key }}" {% if p.key == project %}selected{% endif %}>{{ p.name }} ({{ p.key }})</option>
      {% endfor %}
    </select>
  </label>
</form>
{% if project %}
<form method="get" action="{{ url_for('dashboard.release_redirect') }}" class="card picker">
  <input type="hidden" name="project" value="{{ project }}">
  <label>Fix version
    <select name="version" required>
      {% for v in versions %}
        <option value="{{ v.name }}">{{ v.name }}{% if v.released %} (released){% endif %}</option>
      {% else %}
        <option value="" disabled>No versions in this project</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Show readiness</button>
</form>
{% endif %}
{% endblock %}
